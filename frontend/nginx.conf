# Serves the web UI and forwards /api/ to the FastAPI service.
# Security headers, TLS and rate limits are added in Phase 22 (ASVS checklist).
server {
    listen 8080;
    server_name _;
    server_tokens off;                 # do not reveal the nginx version
    client_max_body_size 26m;          # 25 MB upload limit (REQUIREMENTS.md NFR-06) plus headroom

    root /usr/share/nginx/html;

    # Container health check only.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The detailed dependency report stays inside the stack (ASVS V13.4.5);
    # use `docker compose exec api python -m app.health_cli` instead.
    location = /api/health {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
