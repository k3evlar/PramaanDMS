# CI: installs the tools, then runs the same script as a local run (tools/ci.py).
# Actions are pinned to full commit SHAs (supply chain, threat T53).
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly dependency audit (REQUIREMENTS.md 4.9)

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: "8.30.1"
      SEMGREP_VERSION: "1.181.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ml/requirements-data.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python tools
        run: python -m pip install -r requirements-dev.txt

      - name: Install Semgrep in its own environment (its dependencies conflict with the app's)
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run all checks
        run: python tools/ci.py

      - name: Scan git history for secrets
        run: gitleaks git --redact --no-banner --config .gitleaks.toml
